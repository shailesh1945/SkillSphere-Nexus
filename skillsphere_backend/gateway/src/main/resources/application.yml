server:
  port: 8090

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:

            # Skill Service
            - id: skill-service
              uri: http://localhost:8085
              predicates:
                - Path=/api/skills/**

            - id: employee-service
              uri: http://localhost:8085
              predicates:
                - Path=/api/employees/**

            - id: skill-profile-service
              uri: http://localhost:8085
              predicates:
                - Path=/api/skill-profiles/**

            # Assessment APIs
            - id: assessment-service
              uri: http://localhost:8085
              predicates:
                - Path=/api/assessments/**

            # Competency APIs
            - id: competency-service
              uri: http://localhost:8085
              predicates:
                - Path=/api/competency/**

            # Certification APIs
            - id: certification-service
              uri: http://localhost:8085
              predicates:
                - Path=/api/certifications/**

            # Learning Service
            - id: learning-service
              uri: http://localhost:8084
              predicates:
                - Path=/api/learning/**

            # Career Service
            - id: career-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/career/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

  endpoint:
    gateway:
      access: read-only

logging:
  level:
    org.springframework.cloud.gateway: DEBUG