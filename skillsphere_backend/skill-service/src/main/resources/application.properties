spring.application.name=skill_service

# database configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/skillsphere_db
spring.datasource.username=postgres
spring.datasource.password=Stark@1945
spring.datasource.driver-class-name=org.postgresql.Driver


spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/skillsphere

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.devtools.restart.enabled=true

server.port=8085

logging.level.root=INFO
logging.level.com.skillsphere=INFO

management.endpoints.web.exposure.include=health,info
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# kafka configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# redis configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
